env:
  MCP_TOKEN:
    required: true
  HERMES4_BASE_URL:
    required: true
  HERMES4_MODEL_NAME:
    required: true
  HERMES_DASHBOARD_BASIC_AUTH_USERNAME:
    required: true
  HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:
    required: true    # NOT generate:hex -- a human needs to actually know this
                       # value to log in; generate:hex is for secrets only the
                       # app itself ever reads.
  HERMES_DASHBOARD_BASIC_AUTH_SECRET:
    generate: hex
  HERMES_DASHBOARD_PUBLIC_URL:
    required: true
  API_SERVER_KEY:
    generate: hex   # loopback-only local API server, for bot-to-bot peer
                     # delivery -- never surfaced to a human, entrypoint
                     # reads it from its own env to self-register the peer
database: false
persistent_storage:
  mount_path: /opt/data
