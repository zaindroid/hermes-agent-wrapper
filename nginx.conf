server {
    listen 8080;

    # Coolify's health check is hardcoded to GET /health on this port --
    # Hermes' own /health lives on the (disabled) API-server port, so this
    # is a static liveness signal, not a real readiness probe. The
    # dashboard's own GET /api/status (proxied below, unauthenticated by
    # Hermes itself) is the real one to check by hand.
    location /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Bots UI: companion multi-bot management app (see bots-ui/backend for
    # why this exists instead of being a page inside the real dashboard).
    # It has no auth of its own -- unlike everything under / (Hermes' own
    # dashboard, gated by its internal session-cookie system), so every
    # location below reuses the dashboard basic-auth credential via a
    # generated htpasswd file (see entrypoint.sh). Real gap found live:
    # without this, /bots and /bots-api were fully unauthenticated.

    # Static frontend...
    location /bots/ {
        auth_basic "Bots UI";
        auth_basic_user_file /etc/nginx/.htpasswd-bots;
        alias /opt/bots-ui/frontend/;
        try_files $uri $uri/ /bots/index.html;
    }

    # ...its backend API (prefix stripped: /bots-api/roster -> /roster)...
    location /bots-api/ {
        auth_basic "Bots UI";
        auth_basic_user_file /etc/nginx/.htpasswd-bots;
        proxy_pass http://127.0.0.1:8643/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 6M;
    }

    # ...and uploaded bot avatar images.
    location /bots-avatars/ {
        auth_basic "Bots UI";
        auth_basic_user_file /etc/nginx/.htpasswd-bots;
        alias /opt/data/bots-ui-avatars/;
    }

    location / {
        proxy_pass http://127.0.0.1:9119;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Prefix /;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
