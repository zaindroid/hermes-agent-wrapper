name: grok
label: Grok
description: Minimal near-black dark mode with high-contrast white text and no color noise -- inspired by Grok/X's chat UI

palette:
  background: "#0a0a0a"
  midground: "#e5e5e5"
  foreground:
    hex: "#ffffff"
    alpha: 0
  warmGlow: "rgba(255, 255, 255, 0.05)"
  noiseOpacity: 0

typography:
  fontSans: '"Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'
  fontMono: 'ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace'
  fontUrl: "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
  baseSize: "15px"
  lineHeight: "1.6"
  letterSpacing: "-0.006em"

layout:
  radius: "0.75rem"
  density: comfortable

layoutVariant: standard

colorOverrides:
  card: "#161616"
  cardForeground: "#f2f2f2"
  popover: "#1a1a1a"
  popoverForeground: "#f2f2f2"
  primary: "#f2f2f2"
  primaryForeground: "#0a0a0a"
  secondary: "#1f1f1f"
  secondaryForeground: "#f2f2f2"
  muted: "#1a1a1a"
  mutedForeground: "#9a9a9a"
  accent: "#242424"
  accentForeground: "#f2f2f2"
  destructive: "#ef4444"
  destructiveForeground: "#ffffff"
  success: "#22c55e"
  warning: "#f59e0b"
  border: "#262626"
  input: "#1a1a1a"
  ring: "#525252"

customCSS: |
  /* Tighter, flatter chrome -- no drop shadows, thin unobtrusive scrollbars */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: #383838; }
